<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monkey Tapper</title>
    <link rel="stylesheet" href="style.css?v=10">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="game-container">
        <h1>🐒 Monkey Tapper</h1>
        <p id="coins-display">💰 Монеты: 0</p>
        
        <!-- Кнопка-обезьяна -->
        <div id="tap-area">
            <img src="monkey.png" id="monkey-img" alt="Кликай!">
        </div>

        <!-- Шкала энергии -->
        <div class="energy-container">
            <div class="energy-text">⚡ <span id="energy-display">1000</span> / <span id="max-energy-display">1000</span></div>
            <div class="energy-bar-bg">
                <div id="energy-bar-fill" class="energy-bar-fill"></div>
            </div>
        </div>

        <!-- Блок улучшений -->
        <div class="upgrades-container">
            <button id="multitap-btn" class="upgrade-btn" type="button">
                <div class="upgrade-info">
                    <span class="upgrade-title">⚡ Мультитап (Ур. <span id="multitap-level">1</span>)</span>
                    <span class="upgrade-desc">+<span id="multitap-power">1</span> за клик</span>
                </div>
                <div class="upgrade-cost">
                    💰 <span id="multitap-cost">50</span>
                </div>
            </button>
        </div>
    </div>

    <script src="script.js?v=10"></script>
</body>
</html>
