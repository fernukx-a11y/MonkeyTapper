<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Monkey Tapper</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css?v=200">
</head>

<body>

<div id="app">

    <!-- GAME -->
    <section id="game-screen" class="screen active">

        <div class="top-bar">
            <div class="balance">
                <span class="coin-icon">🪙</span>
                <span id="coins">0</span>
            </div>

            <div class="energy">
                ⚡ <span id="energy">1000</span>/1000
            </div>
        </div>

        <div class="monkey-area">
            <div id="tap-effect-container"></div>

            <button id="monkey-button" class="monkey-button">
                🐒
            </button>
        </div>

        <div class="tap-info">
            +<span id="tap-power">0.2</span> за тап
        </div>

        <div class="boosts">

            <div class="boost-card">
                <div class="boost-icon">🌴</div>

                <div class="boost-info">
                    <div class="boost-title">Кусты</div>
                    <div class="boost-level">
                        Уровень <span id="bush-level">0</span>
                    </div>
                </div>

                <button id="buy-bush" class="buy-button">
                    <span id="bush-cost">100</span> 🪙
                </button>
            </div>

            <div class="boost-card">
                <div class="boost-icon">🌳</div>

                <div class="boost-info">
                    <div class="boost-title">Плантация</div>
                    <div class="boost-level">
                        Уровень <span id="plantation-level">0</span>
                    </div>
                </div>

                <button id="buy-plantation" class="buy-button">
                    <span id="plantation-cost">1000</span> 🪙
                </button>
            </div>

        </div>

    </section>


    <!-- BOOSTS -->
    <section id="boosts-screen" class="screen">

        <div class="screen-title">
            Усиления
        </div>

        <div class="boost-list">

            <div class="boost-card">
                <div class="boost-icon">👆</div>

                <div class="boost-info">
                    <div class="boost-title">Сила тапа</div>
                    <div class="boost-level">
                        Уровень <span id="tap-level">1</span>
                    </div>
                </div>

                <button id="buy-tap" class="buy-button">
                    <span id="tap-cost">50</span> 🪙
                </button>
            </div>

            <div class="boost-card">
                <div class="boost-icon">🌴</div>

                <div class="boost-info">
                    <div class="boost-title">Кусты</div>
                    <div class="boost-level">
                        +0.5 🪙/сек
                    </div>
                </div>

                <button id="buy-bush-2" class="buy-button">
                    <span id="bush-cost-2">100</span> 🪙
                </button>
            </div>

            <div class="boost-card">
                <div class="boost-icon">🌳</div>

                <div class="boost-info">
                    <div class="boost-title">Плантация</div>
                    <div class="boost-level">
                        +2 🪙/сек
                    </div>
                </div>

                <button id="buy-plantation-2" class="buy-button">
                    <span id="plantation-cost-2">1000</span> 🪙
                </button>
            </div>

        </div>

    </section>


    <!-- PROFILE -->
    <section id="profile-screen" class="screen">

        <div class="screen-title">
            Профиль
        </div>

        <div class="profile-card">

            <div class="profile-avatar">
                🐒
            </div>

            <div class="profile-name" id="profile-name">
                Игрок
            </div>

            <div class="profile-username" id="profile-username">
                @player
            </div>

            <button id="rename-button" class="profile-button">
                Изменить имя
            </button>

        </div>

        <div class="profile-stats">

            <div class="stat-card">
                <div class="stat-value" id="profile-coins">
                    0
                </div>
                <div class="stat-label">
                    Монет
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="profile-level">
                    1
                </div>
                <div class="stat-label">
                    Уровень
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="profile-refs">
                    0
                </div>
                <div class="stat-label">
                    Рефералы
                </div>
            </div>

        </div>

        <button id="ref-button" class="big-button">
            👥 Пригласить
        </button>

        <button id="channel-button" class="big-button">
            📢 Подписаться на канал
        </button>

        <button id="leaderboard-button" class="big-button">
            🏆 Лидерборд
        </button>

    </section>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button
            class="nav-button active"
            data-screen="game-screen"
        >
            <span>🐒</span>
            <small>Игра</small>
        </button>

        <button
            class="nav-button"
            data-screen="boosts-screen"
        >
            <span>⚡</span>
            <small>Бусты</small>
        </button>

        <button
            class="nav-button"
            data-screen="profile-screen"
        >
            <span>👤</span>
            <small>Профиль</small>
        </button>

    </nav>

</div>


<!-- LEADERBOARD MODAL -->
<div id="leaderboard-modal" class="modal hidden">

    <div class="modal-content">

        <button
            id="close-leaderboard"
            class="close-button"
        >
            ×
        </button>

        <div class="modal-title">
            🏆 Лидерборд
        </div>

        <div id="leaderboard-list"></div>

    </div>

</div>


<!-- RENAME MODAL -->
<div id="rename-modal" class="modal hidden">

    <div class="modal-content">

        <button
            id="close-rename"
            class="close-button"
        >
            ×
        </button>

        <div class="modal-title">
            Изменить имя
        </div>

        <input
            id="rename-input"
            class="rename-input"
            type="text"
            maxlength="20"
            placeholder="Новое имя"
        >

        <button
            id="save-name"
            class="big-button"
        >
            Сохранить
        </button>

    </div>

</div>


<script src="script.js?v=201"></script>

</body>
</html>
