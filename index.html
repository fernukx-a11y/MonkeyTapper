<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monkey Tapper</title>
    <!-- Подключаем стили с версией v=110 -->
    <link rel="stylesheet" href="style.css?v=110">
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="game-container">
        
        <!-- Главный экран (Кликер) -->
        <div id="screen-game" class="screen active">
            <div class="header">
                <div class="coins-container">
                    <span class="coin-icon">💰</span>
                    <span id="coins-display">0</span>
                </div>
                <button id="leaderboard-btn" class="leaderboard-btn">🏆 Рейтинг</button>
            </div>

            <div class="tap-content">
                <div id="tap-area" class="monkey-container">
                    <img src="monkey.png" alt="Monkey" class="monkey-img" draggable="false">
                </div>
            </div>

            <div class="energy-container">
                <div class="energy-info">
                    <span>⚡ Энергия</span>
                    <span><span id="energy-display">1000</span> / 1000</span>
                </div>
                <div class="energy-bar-background">
                    <div id="energy-bar-fill" class="energy-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- Экран прокачки и бонусов -->
        <div id="screen-boosts" class="screen">
            <div class="boosts-header">
                <h2>🚀 Прокачка и Бонусы</h2>
            </div>
            
            <div class="boosts-list">
                <!-- Мультитап -->
                <div class="upgrade-card">
                    <div class="upgrade-info">
                        <span class="upgrade-icon">👆</span>
                        <div>
                            <div class="upgrade-title">Мультитап</div>
                            <div class="upgrade-desc">Уровень: <span id="multitap-level">1</span> (+<span id="multitap-power">1</span> к тапу)</div>
                        </div>
                    </div>
                    <button id="multitap-btn" class="upgrade-btn">
                        <span>💰 <span id="multitap-cost">50</span></span>
                    </button>
                </div>

                <!-- Рефералка -->
                <div class="upgrade-card">
                    <div class="upgrade-info">
                        <span class="upgrade-icon">👥</span>
                        <div>
                            <div class="upgrade-title">Друзья</div>
                            <div class="upgrade-desc" id="ref-count">Приглашено: 0</div>
                        </div>
                    </div>
                    <button id="ref-btn" class="upgrade-btn action-btn">
                        <span>Пригласить</span>
                    </button>
                </div>

                <!-- Канал -->
                <div class="upgrade-card">
                    <div class="upgrade-info">
                        <span class="upgrade-icon">📢</span>
                        <div>
                            <div class="upgrade-title">Наш канал</div>
                            <div class="upgrade-desc">+5 000 монет за подписку</div>
                        </div>
                    </div>
                    <button id="channel-btn" class="upgrade-btn action-btn">
                        <span>Проверить</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchScreen('game')">
                <span class="nav-icon">🪙</span>
                <span class="nav-text">Клик</span>
            </button>
            <button class="nav-item" onclick="switchScreen('boosts')">
                <span class="nav-icon">🚀</span>
                <span class="nav-text">Прокачка</span>
            </button>
        </div>

    </div>

    <!-- Модальное окно рейтинга -->
    <div id="leaderboard-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🏆 Топ-10 Игроков</h3>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div id="leaderboard-list" class="leaderboard-list">
                <p class="loading-text">Загрузка рейтинга...</p>
            </div>
        </div>
    </div>

    <!-- Подключаем основной скрипт игры с версией v=110 -->
    <script src="script.js?v=110"></script>
</body>
</html>
