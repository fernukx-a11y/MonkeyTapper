<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monkey Tapper</title>
    <!-- Увеличиваем версию стилей v=3 для сброса кэша -->
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="game-container">
        <h1>🐒 Monkey Tapper</h1>
        <p id="coins-display">💰 Монеты: 0</p>
        
        <!-- Кнопка-обезьяна -->
        <div id="tap-area">
            <img src="monkey.png" id="monkey-img" alt="Кликай!">
        </div>

        <!-- Контейнер энергии -->
        <div class="energy-container">
            <div class="energy-text">⚡ <span id="energy-display">1000</span> / 1000</div>
            <div class="energy-bar">
                <div id="energy-fill" class="energy-fill"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
