<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monkey Tapper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2e, #2a2a3e);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        #coins-display {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .tap-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }

        #tap-area {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff9900, #cc7700);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.4);
            transition: transform 0.05s ease-in-out;
            touch-action: manipulation;
            overflow: hidden;
            border: 4px solid #ff9900;
        }

        #tap-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
        }

        #tap-area:active {
            transform: scale(0.95);
        }

        .energy-container {
            width: 100%;
            max-width: 320px;
            margin-bottom: 15px;
        }

        .energy-text {
            font-size: 16px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .energy-bar {
            width: 100%;
            height: 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        #energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            transition: width 0.2s ease;
        }

        .upgrades-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: #ff9900;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .upgrade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .flying-one {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            pointer-events: none;
            animation: floatUp 1s forwards ease-out;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="coins-display">💰 Монеты: 0</div>
    </div>

    <div class="tap-container">
        <div id="tap-area">
            <img src="monkey.png?v=6" alt="Monkey" id="monkey-img">
        </div>
    </div>

    <div class="energy-container">
        <div class="energy-text">
            <span>⚡ Энергия</span>
            <span><span id="energy-display">1000</span> / 1000</span>
        </div>
        <div class="energy-bar">
            <div id="energy-bar-fill"></div>
        </div>
    </div>

    <div class="upgrades-container">
        <div class="upgrade-card">
            <div>
                <div><b>Мультитап (Ур. <span id="multitap-level">1</span>)</b></div>
                <div style="font-size: 12px; opacity: 0.7;">+<span id="multitap-power">1</span> к клику</div>
            </div>
            <button id="multitap-btn" class="upgrade-btn">
                <span id="multitap-cost">50</span> 💰
            </button>
        </div>

        <!-- Блок рефералов -->
        <div id="referral-section" style="padding: 12px 15px; background: rgba(255,255,255,0.08); border-radius: 12px; text-align: center;">
            <h3 style="font-size: 16px; margin-bottom: 4px;">👥 Пригласи друга</h3>
            <p style="font-size: 12px; opacity: 0.8; margin-bottom: 8px;">Получи <b>+10,000</b> монет за каждого друга!</p>
            <button id="ref-btn" style="padding: 8px 16px; border-radius: 8px; background: #2ea44f; color: white; border: none; font-weight: bold; cursor: pointer; width: 100%;">
                📋 Скопировать ссылку
            </button>
            <p id="ref-count" style="margin-top: 6px; font-size: 12px; opacity: 0.7;">Приглашено друзей: 0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
