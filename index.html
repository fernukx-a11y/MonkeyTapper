<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monkey Tapper</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- Шапка с монетами -->
        <div class="header">
            <div id="coins-display">💰 Монеты: 0</div>
            <button id="leaderboard-btn" class="top-btn">🏆 Топ</button>
        </div>

        <!-- Область клика по обезьянке -->
        <div class="tap-section">
            <div id="tap-area" class="monkey-avatar">
                🐒
            </div>
        </div>

        <!-- Энергия -->
        <div class="energy-container">
            <div class="energy-text">⚡ Энергия: <span id="energy-display">1000</span> / 1000</div>
            <div class="energy-bar">
                <div id="energy-bar-fill"></div>
            </div>
        </div>

        <!-- Меню улучшений и бонусов -->
        <div class="upgrades-section">
            <div class="upgrade-card">
                <span>Мультитап (Ур. <span id="multitap-level">1</span>)</span>
                <span>+<span id="multitap-power">1</span> за тап</span>
                <button id="multitap-btn">Купить (<span id="multitap-cost">50</span> 💰)</button>
            </div>
            
            <button id="ref-btn" class="action-btn">👥 Пригласить друзей (+5000)</button>
            <div id="ref-count" class="ref-count-text">Приглашено друзей: 0</div>

            <button id="channel-btn" class="action-btn channel-btn-style">📢 Подписаться на канал (+5000)</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ТАБЛИЦЫ ЛИДЕРОВ -->
    <div id="leaderboard-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2>🏆 Топ игроков</h2>
            <div id="leaderboard-list">
                <p class="loading-text">Загрузка рейтинга...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
